services:
  - type: web
    name: cms-cafe
    runtime: python
    rootDir: CMS
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    plan: starter
    disk:
      name: cms-cafe-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/cafe.sqlite3
      - key: PUBLIC_BASE_URL
        value: https://cms-cafe.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
